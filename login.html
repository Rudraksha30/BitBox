<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="./img/favicon_io/favicon.ico" />

    <title>BitBox - Login</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <!-- logo -->
        <img class="logo" src="./img/logo.png" alt="BitBox Logo" />

        <!-- Menu -->
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="bitedeals.html">Bite Deals</a></li>
          <li>
            <a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a>
          </li>
          <li>
            <a href="login.html"
              ><i class="fa-solid fa-right-from-bracket"></i>Login</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <section class="auth-container">
      <div class="auth-box">
        <h2>Login to Bit<span style="color: red">Box</span></h2>
        <form>
          <input type="email" placeholder="Enter Email" id="email" required />
          <div style="position: relative">
            <input
              type="password"
              placeholder="Enter password"
              id="password"
              required
            />
            <i
              class="fa-solid fa-eye"
              onclick="togglePassword()"
              style="position: absolute; top: 20px; right: 10px"
            ></i>
          </div>
          <button type="button" onclick="login()">Login</button>
          <p id="error" style="color: red"></p>
          <p><a href="./signup.html">Forgot Password</a></p>
          <p>Don't have an Account? <a href="./signup.html">Sign Up</a></p>
        </form>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
