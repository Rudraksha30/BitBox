<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="./img/favicon_io/favicon.ico" />
    <title>BiteBox - Menu</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <!-- logo -->
        <img class="logo" src="./img/logo.png" alt="BitBox Logo" />
        <button class="menu-btn" onclick="toggleMenu()">
          <i id="menuIcon" class="fa-solid fa-bars"></i>
        </button>

        <ul id="navMenu">
          <li><a href="home.html">Home</a></li>
          <li><a href="menu.html" class="active">Menu</a></li>
          <li><a href="bitedeals.html">Bite Deals</a></li>
          <li>
            <a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a>
          </li>
          <li>
            <a href="login.html"
              ><i class="fa-solid fa-right-from-bracket"></i>Login</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <section class="category-icons">
       <div class="icon-box">
        <img src="./media/f-all.png" alt="" >
        <p>All</p>
      </div>

      <div class="icon-box">
        <img src="./media/burger.png" alt="" >
          <p>Burger</p>
      </div>

      <div class="icon-box">
        <img src="./media/m-pizza.png" alt="" >
          <p>pizza</p>
      </div>

      <div class="icon-box">
        <img src="./media/coffee.png" alt="" >
          <p>coffee</p>
      </div>

      <div class="icon-box">
        <img src="./media/momos.png" alt="" >
          <p>momos</p>
      </div>

      <div class="icon-box">
        <img src="./media/fries.png" alt="" >
          <p>fries</p>
      </div>

      <div class="icon-box">
        <img src="./media/pasta.png" alt="" >
          <p>pasta</p>
      </div>

      <div class="icon-box">
        <img src="./media/veg-thali.png" alt="" >
          <p>Veg Thali</p>
      </div>

    </section>

    <section class="menu">
      <h2>Our Menu</h2>

      <div class="menu-container">
        <div class="card">
          <img src="./media/burger.png" alt="s-burger" />
          <h3>Burger</h3>
          <p>Surprise Burger</p>
          <span>Rs. 129</span>
          <button>Add to Cart</button>
        </div>

        <div class="card">
          <img src="./media/m-pizza.png" alt="m-pizza" />
          <h3>Pizza</h3>
          <p>Margeritta Pizza</p>
          <span>Rs. 149</span>
          <button>Add to Cart</button>
        </div>

        <div class="card">
          <img src="./media/p-pizza.png" alt="p-pizza" />
          <h3>Pizza</h3>
          <p>Paneer Pizza</p>
          <span>Rs. 199</span>
          <button>Add to Cart</button>
        </div>

        <div class="card">
          <img src="./media/pasta.png" alt="pasta" />
          <h3>Pasta</h3>
          <p>Vegetable pasta</p>
          <span>Rs. 129</span>
          <button>Add to Cart</button>
        </div>
      </div>

    </section>

    <script src="script.js"></script>
  </body>
</html>
