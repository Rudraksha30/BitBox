<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="./img/favicon_io/favicon.ico" />
    <title>BiteBox - Bite Deals</title>
<link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        
          <!-- logo -->
<img class="logo" src="./img/logo.png"  alt="BitBox Logo" />
          <!-- Menu -->
          <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="bitedeals.html" class="active" >Bite Deals</a></li>
            <li>
              <a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a>
            </li>
            <li>
              <a href="login.html"
                ><i class="fa-solid fa-right-from-bracket"></i>Login</a
              >
            </li>
          </ul>
        
      </nav>
    </header>

    <section class="deals-page">
      <div class="deal-hero">
        <h1>Bite Deals</h1>
        <p>Save more on your favourite meals.</p>
      </div>
    </section>

    <section class="combo-section">
      <h2 class="section-title"></h2>
      <div class="combo-container">
        <div class="combo-card">
          <img src="./media/burger-meal.png" alt="Burger Combo Meal">
          <h3>Burger + Fries + Coke</h3>
          <p>Perfect snacks combo</p>
          <h4><span>Rs.359</span> Rs.199</h4>
          <button>Order Now</button>
        </div>

        <div class="combo-card">
          <img src="./media/pizza-meal.png" alt="Pizza Combo Meal">
          <h3>Pizza + Coke</h3>
          <p>Perfect snacks combo</p>
          <h4><span>Rs.299</span> Rs.199</h4>
          <button>Order Now</button>
        </div>
        
        <div class="combo-card">
          <img src="./media/pasta-meal.png" alt="Pasta Combo Meal">
          <h3>Pasta + Garlic Bread</h3>
          <p>Perfect snacks combo</p>
          <h4><span>Rs.249</span> Rs.159</h4>
          <button>Order Now</button>
        </div>
      </div>
    </section>

  </body>
</html>
